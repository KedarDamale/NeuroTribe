[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -ra
markers =
    integration: exercises several subsystems together
    slow: takes more than a few seconds (renders video, runs full analyses)
    requires_docker: needs a reachable Docker daemon
    requires_tribe: needs the real TRIBE v2 package installed
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:bids.*
    ignore::UserWarning:nilearn.*
